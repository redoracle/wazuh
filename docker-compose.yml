services:
  wazuh:
    image: wazuh/wazuh:${WAZUH_STACK_TAG:-3.10.2_7.3.2}
    hostname: wazuh-manager
    restart: always
    expose:
      - "1514/udp"
      - "1515"
      - "514/udp"
      - "55000"
    networks:
      sll_net:
        ipv4_address: 172.13.0.104

  elasticsearch:
    image: wazuh/wazuh-elasticsearch:${WAZUH_STACK_TAG:-3.10.2_7.3.2}
    hostname: elasticsearch
    restart: always
    expose:
      - "9200"
    networks:
      sll_net:
       ipv4_address: 172.13.0.103
    volumes:
    - /DATA/Wazuh/Elasticsearch:/Datak
    environment:
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - ELASTIC_CLUSTER=true
      - CLUSTER_NODE_MASTER=true
      - CLUSTER_MASTER_NODE_NAME=es01
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g

  kibana:
    image: wazuh/wazuh-kibana:${WAZUH_STACK_TAG:-3.10.2_7.3.2}
    hostname: kibana
    restart: always
    volumes:
      - /DATA/Wazuh/Kibana:/Datak
    networks:
      sll_net:
       ipv4_address: 172.13.0.102
    depends_on:
      - elasticsearch

  nginx:
    image: wazuh/wazuh-nginx:${WAZUH_STACK_TAG:-3.10.2_7.3.2}
    hostname: nginx
    restart: always
    volumes:
    - /DATA/Wazuh/Nginx:/Datak
    environment:
      - NGINX_PORT=443
      - NGINX_CREDENTIALS
    expose:
      - "80"
      - "443"
    networks:
      sll_net:
       ipv4_address: 172.13.0.101
    depends_on:
      - kibana

  packetbeat:
    image: docker.elastic.co/beats/packetbeat:${BEATS_TAG:-7.4.2}
    hostname: packetbeat
    restart: always
    networks:
      sll_net:
       ipv4_address: 172.13.0.105
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      - elasticsearch
      - kibana

  filebeat:
    image: docker.elastic.co/beats/filebeat:${BEATS_TAG:-7.4.2}
    hostname: filebeat
    user: root
    restart: always
    networks:
      sll_net:
       ipv4_address: 172.13.0.106
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /DATA/Wazuh/Filebeat/filebeat.yml:/etc/filebeat/filebeat.yml:ro
      - /DATA/Wazuh/Filebeat/:/Datak
    depends_on:
      - elasticsearch
      - kibana

  auditbeat:
    image: docker.elastic.co/beats/auditbeat:${BEATS_TAG:-7.4.2}
    hostname: auditbeat
    restart: always
    networks:
      sll_net:
       ipv4_address: 172.13.0.107
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_READ
    pid: host
    volumes:
      - /DATA/Wazuh/Auditbeat/auditbeat.yml:/etc/auditbeat/auditbeat.yml:ro
      - /DATA/Wazuh/Auditbeat/:/Datak
    depends_on:
      - elasticsearch
      - kibana

  journalbeat:
    image: docker.elastic.co/beats/journalbeat:${BEATS_TAG:-7.4.2}
    hostname: journalbeat
    restart: always
    networks:
      sll_net:
       ipv4_address: 172.13.0.108
    volumes:
      - /DATA/Wazuh/Journalbeat:/Datak
      - /run/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /run/systemd:/run/systemd:ro
      - /etc/hostname:/etc/hostname:ro
    depends_on:
      - elasticsearch
      - kibana

  heartbeat:
    image: docker.elastic.co/beats/heartbeat:${BEATS_TAG:-7.4.2}
    hostname: heartbeat
    restart: always
    networks:
      sll_net:
       ipv4_address: 172.13.0.109
    volumes:
      - /DATA/Wazuh/Heartbeat:/Datak
    depends_on:
      - elasticsearch
      - kibana

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:${BEATS_TAG:-7.4.2}
    hostname: metricbeat
    restart: always
    user: root
    networks:
      sll_net:
       ipv4_address: 172.13.0.110
    cap_add:
      - dac_read_search
      - sys_ptrace
    volumes:
      - /DATA/Wazuh/Metricbeat/metricbeat.yml:/etc/metricbeat/metricbeat.yml:ro
      - /DATA/Wazuh/Metricbeat/:/Datak
      - /:/hostfs:ro
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
      - kibana

networks:
  sll_net:
    external: true
