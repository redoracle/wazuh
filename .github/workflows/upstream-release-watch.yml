name: Upstream stable Wazuh release monitor

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wazuh-upstream-release-watch
  cancel-in-progress: false

jobs:
  check-stable-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare against official latest stable release (no mutations)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_upstream_release.py | tee -a "$GITHUB_STEP_SUMMARY"
